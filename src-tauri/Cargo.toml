[package]
name = "fader"
version = "0.1.0"
description = "Contrôle de luminosité et d'écrans pour Hyprland"
authors = ["Pierre Sylla"]
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
